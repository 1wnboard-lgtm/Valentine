
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0, #ee9ca7, #ffdde1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            color: #d81b60;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.4);
            padding: 3rem;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        h1 { font-size: 2.5rem; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }

        /* The Heart Button */
        #heart-btn {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-block;
            filter: drop-shadow(0 5px 15px rgba(216, 27, 96, 0.4));
        }

        #heart-btn:hover { transform: scale(1.2) rotate(-5deg); }

        .choices {
            margin-top: 30px;
            display: none; /* Hidden until heart is clicked */
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            background-color: #ff758f;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
        }

        #message {
            display: none;
            font-size: 2rem;
            font-weight: bold;
            margin-top: 20px;
            color: #880e4f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="headline">Click the heart...</h1>
        <div id="heart-btn" onclick="explodeHeart()">❤️</div>

        <div class="choices" id="choices">
            <h2>Will you be my Valentine?</h2>
            <button class="btn" onclick="celebrate()">Yes</button>
            <button class="btn" onclick="celebrate()">YES!</button>
        </div>

        <div id="message">Yay! I love you Gabrielle!! ❤️</div>
    </div>

    <script>
        function explodeHeart() {
            // Confetti explosion
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff0000', '#ff69b4', '#800080']
            });

            // UI Changes
            document.getElementById('heart-btn').style.display = 'none';
            document.getElementById('headline').innerText = "I have a question...";
            document.getElementById('choices').style.display = 'block';
        }

        function celebrate() {
            confetti({
                particleCount: 200,
                spread: 160,
                colors: ['#ff4d6d', '#ff758f', '#c9184a']
            });
            document.getElementById('choices').style.display = 'none';
            document.getElementById('headline').style.display = 'none';
            document.getElementById('message').style.display = 'block';
        }
    </script>
</body>
</html>
